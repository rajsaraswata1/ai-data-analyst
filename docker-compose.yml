# NOTE: written but NOT executed in the development sandbox (no Docker available there).
services:
  analyst:
    build: .
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (e.g. python -c "import secrets;print(secrets.token_hex(32))")}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-₹}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - analyst-data:/app/data
      - analyst-logs:/app/logs
    restart: unless-stopped

volumes:
  analyst-data:
  analyst-logs:
